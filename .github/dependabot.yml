# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Note that Dependabot *security* updates are driven by the repository's alert
# feed and do not read this file - that is why security PRs arrived while this
# config was still the unedited scaffold.

version: 2
updates:
  # The converter playground. Only `parcel` and `htmlparser2` are direct
  # dependencies, but Parcel's transitive tree is large, so group the routine
  # bumps into one PR and let majors come through on their own.
  - package-ecosystem: "npm"
    directory: "/src/convert-html-to-fsharp-html-dsl"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The F# library plus its test, browser-test and benchmark projects, all
  # reachable from fsharp-html-dsl.sln. FSharp.Core is pinned centrally via
  # `PackageReference Update`, so treat its majors as individual PRs too.
  - package-ecosystem: "nuget"
    directory: "/src/fsharp-html-dsl"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
